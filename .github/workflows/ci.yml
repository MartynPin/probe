# Гейты продуктового репозитория. Вся логика — в factory-ci; здесь только вызов.
#
# ВНИМАНИЕ: `@main` подставлен как заглушка и обязан быть заменён на полный
# 40-символьный SHA коммита factory-ci. Ссылка на ветку означает, что правка в
# factory-ci немедленно меняет проверки во всех репозиториях, включая уже
# открытые PR. `setup/verify.sh` считает `@main` расхождением.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  gates:
    permissions:
      contents: read
    uses: Online-Base1/factory-ci/.github/workflows/gates.yml@b9443c4a0bc7e08fe34e9200fa767fff8496bbdc
    with:
      node-version: "22"
      run-e2e: true
