# Production deployment is intentionally fail-closed until a managed target,
# immutable artifact handoff and owner approval are configured and tested.
name: deploy-disabled

on:
  workflow_dispatch:

permissions: {}

jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Production deployment is not configured
        shell: bash
        run: |
          echo "::error::Production deployment is disabled. Configure a managed target, immutable artifact handoff and owner approval before enabling it."
          exit 1
